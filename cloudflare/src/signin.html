<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentMesh · Sign in</title>
  <meta name="robots" content="noindex">
  <script nonce="__AGENTMESH_NONCE__">
    (function () { try { const theme = localStorage.getItem("papers-theme"); if (theme === "dark" || theme === "light") document.documentElement.setAttribute("data-theme", theme); } catch {} })();
  </script>
  <style nonce="__AGENTMESH_NONCE__">
    /* Notion-style sign-in; palette shared with dashboard.html. */
    :root{
      --bg:#fff; --text:#37352f; --muted:rgba(55,53,47,.65); --line:rgba(55,53,47,.16); --line-soft:rgba(55,53,47,.09);
      --hover:rgba(55,53,47,.08); --accent:#2383e2; --accent-hover:#0077d4; --red:#d44c47;
      --focus:rgba(35,131,226,.57) 0 0 0 1px inset,rgba(35,131,226,.35) 0 0 0 2px;
    }
    html[data-theme="light"]{color-scheme:light}
    html[data-theme="dark"]{color-scheme:dark;
      --bg:#191919; --text:rgba(255,255,255,.81); --muted:rgba(255,255,255,.55); --line:rgba(255,255,255,.13);
      --line-soft:rgba(255,255,255,.094); --hover:rgba(255,255,255,.055); --red:#ff7369;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,"Apple Color Emoji",Arial,sans-serif;-webkit-font-smoothing:antialiased}
    button,input{font:inherit;color:inherit}
    button{cursor:pointer;min-height:28px;padding:0 10px;background:transparent;border:0;border-radius:6px;color:var(--muted);font-weight:500}
    button:hover{background:var(--hover);color:var(--text)}
    button:disabled{opacity:.4;cursor:not-allowed}
    :focus-visible{outline:none;box-shadow:var(--focus);border-radius:6px}
    .shell{min-height:100dvh;display:flex;flex-direction:column;padding:0 16px}
    .masthead{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:52px}
    .brand{display:flex;align-items:center;gap:8px;font-weight:600}
    .brand-mark{width:22px;height:22px;padding:3px;border-radius:5px;background:var(--text);color:var(--bg)}
    .eyebrow{display:none}
    h1{font-size:14px;font-weight:600;margin:0}
    .auth{width:100%;max-width:320px;margin:14vh auto 48px}
    .auth-icon{font-size:48px;line-height:1;margin-bottom:14px}
    h2{font-size:26px;font-weight:700;line-height:1.25;margin:0 0 6px}
    .auth p{color:var(--muted);margin:0 0 20px}
    label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin:14px 0 6px}
    label span{font-weight:400}
    input{width:100%;min-height:36px;padding:4px 10px;border:0;border-radius:6px;background:var(--hover);box-shadow:var(--line-soft) 0 0 0 1px inset;font-size:15px}
    input:focus{outline:none;box-shadow:var(--focus);background:var(--bg)}
    .submit{width:100%;min-height:36px;margin-top:20px;background:var(--accent);color:#fff;font-size:14px}
    .submit:hover{background:var(--accent-hover);color:#fff}
    .auth .error{color:var(--red);font-size:13px;min-height:20px;margin:10px 0 0}
    a{color:inherit;text-underline-offset:3px}
    @media(pointer:coarse){button,input,.submit{min-height:44px}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M12 12 36 24 12 36Z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="5" fill="currentColor"/><circle cx="36" cy="24" r="5" fill="currentColor"/><circle cx="12" cy="36" r="5" fill="currentColor"/></svg>
        <div><div class="eyebrow">Team workspace</div><h1>AgentMesh</h1></div>
      </div>
      <button id="theme-toggle" type="button">Dark theme</button>
    </header>
    <main class="auth">
      <div class="auth-icon" aria-hidden="true">🤝</div>
      <h2>Sign in to your team</h2>
      <p id="signin-hint">Enter your access key (the token from your setup) to open your team dashboard. Team ID is optional.</p>
      <form id="signin-form">
        <label for="access-key">Access key</label>
        <input id="access-key" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="signin-hint" required autofocus>
        <label for="team-id">Team ID <span>(optional)</span></label>
        <input id="team-id" type="text" autocomplete="off" autocapitalize="none" spellcheck="false">
        <button class="submit" id="signin-submit" type="submit">Open team dashboard</button>
        <p class="error" id="signin-error" role="alert" aria-live="polite"></p>
      </form>
    </main>
  </div>
  <script nonce="__AGENTMESH_NONCE__">
    (() => {
      "use strict";
      const get = id => document.getElementById(id);
      const themeButton = get("theme-toggle");
      function updateThemeButton() {
        const dark = document.documentElement.getAttribute("data-theme") === "dark";
        themeButton.textContent = dark ? "Light theme" : "Dark theme";
        themeButton.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
      }
      themeButton.addEventListener("click", () => {
        const theme = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", theme);
        try { localStorage.setItem("papers-theme", theme); } catch {}
        updateThemeButton();
      });
      updateThemeButton();

      get("signin-form").addEventListener("submit", async event => {
        event.preventDefault();
        const submit = get("signin-submit");
        if (submit.disabled) return;
        const message = get("signin-error");
        message.textContent = "";
        const key = get("access-key").value.trim();
        let teamId = get("team-id").value.trim();
        if (!key) { message.textContent = "Key not accepted"; return; }
        submit.disabled = true;
        try {
          if (!teamId) {
            const response = await fetch("/api/state", { headers: { Authorization: "Bearer " + key }, cache: "no-store" });
            if (response.status === 401) { message.textContent = "Key not accepted"; return; }
            if (!response.ok) { message.textContent = "Team not found"; return; }
            const state = await response.json();
            teamId = state.team && state.team.id;
          }
          if (typeof teamId !== "string" || !/^[a-z0-9]+$/.test(teamId)) { message.textContent = "Team not found"; return; }
          location.replace("/t/" + teamId + "#k=" + encodeURIComponent(key));
        } catch {
          message.textContent = "Team not found";
        } finally {
          submit.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
