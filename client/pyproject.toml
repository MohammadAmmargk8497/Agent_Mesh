[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmesh-client"
version = "0.2.0"
description = "Local MCP tools for the AgentMesh API"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "mcp>=1.9,<2"]

[project.scripts]
agentmesh-mcp = "agentmesh_mcp.launcher:main"
agentmesh-mcp-legacy = "agentmesh_mcp.server:main"
agentmesh = "agentmesh_mcp.launcher:cli"
agentmesh-notify = "agentmesh_mcp.server:notify"
agentmesh-setup = "agentmesh_mcp.setup_wizard:main"
agentmesh-guard = "agentmesh_mcp.hooks:guard"
agentmesh-commit-hook = "agentmesh_mcp.hooks:commit_hook"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentmesh_mcp = ["vendor/openhuddle/**/*", "vendor/openhuddle/*"]
