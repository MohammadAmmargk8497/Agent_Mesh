<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentMesh · Sign in</title>
  <meta name="robots" content="noindex">
  <script nonce="__AGENTMESH_NONCE__">
    (function () { try { const theme = localStorage.getItem("papers-theme"); if (theme === "dark" || theme === "light") document.documentElement.setAttribute("data-theme", theme); } catch {} })();
  </script>
  <style nonce="__AGENTMESH_NONCE__">
    :root{
      --bg:#f4f5f0; --panel:#fff; --line:#cbd2ce;
      --text:#101613; --muted:#4f5d58; --cyan:#087e64; --orange:#cf5c26;
    }
    html[data-theme="light"]{color-scheme:light}
    html[data-theme="dark"]{color-scheme:dark;
      --bg:#080b0d; --panel:#0d1214; --line:#293236;
      --text:#f1f3ee; --muted:#a0aaac; --cyan:#77f4d0; --orange:#ff8b51;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 Inter,sans-serif}
    button,input{font:inherit}
    button{cursor:pointer;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 13px}
    button:hover{border-color:var(--muted)}
    button:disabled{opacity:.55;cursor:not-allowed}
    :focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
    .shell{max-width:960px;margin:auto;padding:24px}
    .masthead{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:16px}
    .brand{display:flex;align-items:center;gap:14px}
    .brand-mark{width:42px;height:42px;color:var(--cyan)}
    .eyebrow,.footer{font:11px "JetBrains Mono",monospace}
    .eyebrow{color:var(--cyan);letter-spacing:.15em;text-transform:uppercase}
    h1,h2{font-family:Newsreader,Georgia,serif;font-weight:400;letter-spacing:-.04em}
    h1{font-size:28px;line-height:1.1;margin:4px 0}
    h2{font-size:32px;line-height:1.2;margin:0}
    .auth{max-width:460px;margin:70px auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:28px}
    .auth p{color:var(--muted)}
    label{display:block;font-weight:500;margin:20px 0 7px}
    label span{font-weight:400;color:var(--muted)}
    input{width:100%;min-height:44px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:11px 12px}
    .submit{width:100%;min-height:44px;margin-top:20px;background:var(--text);color:var(--bg);border-color:var(--text)}
    .auth .error{color:var(--orange);font-size:12px;min-height:20px;margin-bottom:0}
    .footer{color:var(--muted);text-align:center;line-height:1.6}
    a{color:inherit;text-underline-offset:3px}
    @media(max-width:480px){.shell{padding:18px 12px}.auth{margin:40px auto;padding:20px}.brand{gap:10px}.brand-mark{width:32px;height:32px}h1{font-size:24px}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M12 12 36 24 12 36Z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="5" fill="currentColor"/><circle cx="36" cy="24" r="5" fill="currentColor"/><circle cx="12" cy="36" r="5" fill="currentColor"/></svg>
        <div><div class="eyebrow">Team workspace</div><h1>AgentMesh</h1></div>
      </div>
      <button id="theme-toggle" type="button">Dark theme</button>
    </header>
    <main class="auth">
      <h2>Sign in</h2>
      <p id="signin-hint">Enter your access key (the token from your setup) to open your team dashboard. Team ID is optional.</p>
      <form id="signin-form">
        <label for="access-key">Access key</label>
        <input id="access-key" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="signin-hint" required autofocus>
        <label for="team-id">Team ID <span>(optional)</span></label>
        <input id="team-id" type="text" autocomplete="off" autocapitalize="none" spellcheck="false">
        <button class="submit" id="signin-submit" type="submit">Open team dashboard</button>
        <p class="error" id="signin-error" role="alert" aria-live="polite"></p>
      </form>
    </main>
    <footer class="footer">Have a legacy Viewer key? <a href="/viewer">Open the viewer dashboard</a>.</footer>
  </div>
  <script nonce="__AGENTMESH_NONCE__">
    (() => {
      "use strict";
      const get = id => document.getElementById(id);
      const themeButton = get("theme-toggle");
      function updateThemeButton() {
        const dark = document.documentElement.getAttribute("data-theme") === "dark";
        themeButton.textContent = dark ? "Light theme" : "Dark theme";
        themeButton.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
      }
      themeButton.addEventListener("click", () => {
        const theme = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", theme);
        try { localStorage.setItem("papers-theme", theme); } catch {}
        updateThemeButton();
      });
      updateThemeButton();

      get("signin-form").addEventListener("submit", async event => {
        event.preventDefault();
        const submit = get("signin-submit");
        if (submit.disabled) return;
        const message = get("signin-error");
        message.textContent = "";
        const key = get("access-key").value.trim();
        let teamId = get("team-id").value.trim();
        if (!key) { message.textContent = "Key not accepted"; return; }
        submit.disabled = true;
        try {
          if (!teamId) {
            const response = await fetch("/api/state", { headers: { Authorization: "Bearer " + key }, cache: "no-store" });
            if (response.status === 401) { message.textContent = "Key not accepted"; return; }
            if (!response.ok) { message.textContent = "Team not found"; return; }
            const state = await response.json();
            teamId = state.team && state.team.id;
          }
          if (typeof teamId !== "string" || !/^[a-z0-9]+$/.test(teamId)) { message.textContent = "Team not found"; return; }
          location.replace("/t/" + teamId + "#k=" + encodeURIComponent(key));
        } catch {
          message.textContent = "Team not found";
        } finally {
          submit.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
